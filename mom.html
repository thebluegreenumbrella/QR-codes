<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Message For You — Blue Green Portal</title>
<style>
  :root{--cream:#fbf3e7;--cream2:#f4e8d6;--charcoal:#26221e;--ink:#5c5248;
    --orange:#f0820d;--orange-dk:#c46000;--blue:#1e6bb8;--green:#41c21a;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,var(--cream) 0%,var(--cream2) 100%);
    color:var(--charcoal);min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:440px;background:rgba(255,255,255,.74);border:2px solid var(--orange);
    border-radius:28px;padding:44px 32px 28px;text-align:center;box-shadow:0 18px 50px rgba(38,34,30,.12)}
  .eyebrow{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-dk);font-weight:700}
  h1{font-size:27px;line-height:1.2;margin:12px 0 8px;letter-spacing:-.01em}
  .sub{color:var(--ink);font-size:15px;margin-bottom:30px}
  .play{width:120px;height:120px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(145deg,var(--orange),var(--orange-dk));color:#fff;display:flex;
    align-items:center;justify-content:center;margin:6px auto 10px;box-shadow:0 10px 26px rgba(240,130,13,.42);
    transition:transform .12s ease}
  .play:active{transform:scale(.95)}
  .play svg{width:48px;height:48px;fill:#fff}
  .play .pause{display:none}
  .play.playing .play-i{display:none}
  .play.playing .pause{display:block}
  .status{font-size:13px;color:var(--ink);min-height:18px;margin-top:8px}
  .bar{height:8px;background:#e8dcc8;border-radius:99px;margin:22px 4px 4px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--orange-dk));border-radius:99px;transition:width .15s linear}
  footer{margin-top:26px}
  .brand{font-size:14px;letter-spacing:.22em;font-weight:800;text-transform:uppercase;color:var(--charcoal)}
  .rule{height:5px;width:150px;margin:8px auto 0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--green))}
  .hint{font-size:11px;color:#a89a86;margin-top:14px}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Press play</div>
    <h1>A little message for you</h1>
    <p class="sub">Tap the button below to listen.</p>
    <button id="play" class="play" aria-label="Play audio">
      <svg class="play-i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="status" id="status">Tap to play</div>
    <div class="bar"><i id="fill"></i></div>
    <audio id="audio" preload="metadata" src="mom_audio.mp3"></audio>
    <footer>
      <div class="brand">Blue Green Portal</div>
      <div class="rule"></div>
      <div class="hint">Thanks for supporting a small handmade shop.</div>
    </footer>
  </main>
<script>
  const a=document.getElementById('audio'),b=document.getElementById('play'),
    s=document.getElementById('status'),f=document.getElementById('fill');
  b.addEventListener('click',()=>{a.paused?a.play().catch(()=>s.textContent='Tap again to allow sound'):a.pause();});
  a.addEventListener('play',()=>{b.classList.add('playing');s.textContent='Playing…';});
  a.addEventListener('pause',()=>{b.classList.remove('playing');if(!a.ended)s.textContent='Paused';});
  a.addEventListener('ended',()=>{b.classList.remove('playing');s.textContent='Play again';f.style.width='0%';});
  a.addEventListener('timeupdate',()=>{if(a.duration)f.style.width=(a.currentTime/a.duration*100)+'%';});
  a.addEventListener('error',()=>s.textContent='Audio file not found — check the file name');
</script>
</body>
</html>
